name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Pull test images
        uses: ./.github/actions/pull-test-images
      - name: Build and test
        env:
          TESTCONTAINERS_PULL_TIMEOUT: 600
        run: ./gradlew build --no-daemon
