x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16
    container_name: oneline-postgres
    environment:
      POSTGRES_DB: oneline_db
      POSTGRES_USER: oneline_user
      POSTGRES_PASSWORD: oneline_pass
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oneline_user -d oneline_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: oneline-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

  s3:
    image: chrislusf/seaweedfs:3.98
    container_name: oneline-s3
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<EOF
        {"identities":[{"name":"oneline","credentials":[{"accessKey":"$${S3_ACCESS_KEY}","secretKey":"$${S3_SECRET_KEY}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        EOF
        exec weed server -dir=/data -s3 -s3.port=9000 -s3.config=/tmp/s3.json -s3.allowedOrigins=http://localhost:8080
    environment:
      S3_ACCESS_KEY: oneline
      S3_SECRET_KEY: oneline_secret
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging: *default-logging

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: oneline-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/oneline_db
      DB_USER: oneline_user
      DB_PASSWORD: oneline_pass
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      S3_ENDPOINT: http://s3:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: oneline
      S3_SECRET_KEY: oneline_secret
      ONELINE_ATTACHMENTS_ENABLED: "${ONELINE_ATTACHMENTS_ENABLED:-true}"
    ports:
      - "8080:8080"
      - "8081:8081"
    logging: *default-logging

  storage-proxy:
    image: caddy:2-alpine
    container_name: oneline-storage-proxy
    depends_on:
      s3:
        condition: service_healthy
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
    ports:
      - "9000:9000"
    logging: *default-logging

volumes:
  pg_data:
  s3_data:
